[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-evidence-pack"
version = "0.1.0"
description = "A lightweight evidence-pack format for summarizing AI-agent runtime governance records for business-facing review."
readme = "README.md"
authors = [{ name = "Cognous", email = "andredelima@cogno.us" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Pinned Replay semantic validator imported by agent_governance_evidence_pack.importer
# (agent_replay_bundle.importers.import_bounded_workflow). Required for traceable imports; the revision to install is
# set by the importer's pinned revision constants; the extra names the Programme-2 Replay revision in full, and the importer
# refuses to emit a trusted-revision claim unless the installed distribution's recorded commit equals the pinned revision and the imported package files are files of that distribution (RECORD membership and recorded sha256).
replay = [
    "agent-replay-bundle @ git+https://github.com/cogno-us/cognous-replay-bundle@2a7963b18d96eb2e9e4fdb1a09c7588cf5c0ef00",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
agep = "agent_governance_evidence_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
