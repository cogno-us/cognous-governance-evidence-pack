name: Recovery inspection evidence
on:
  pull_request:
    paths:
      - src/agent_governance_evidence_pack/recovery_inspection.py
      - tests/recovery_inspection_checks.py
      - docs/recovery-inspection.md
      - .github/workflows/recovery-inspection.yml
  push:
    branches: [main]
    paths:
      - src/agent_governance_evidence_pack/recovery_inspection.py
      - tests/recovery_inspection_checks.py
      - docs/recovery-inspection.md
      - .github/workflows/recovery-inspection.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-replay-bundle
          ref: 696e7bc2432fc7b5cf2d6e6c5f0b944b2d9a265f
          path: replay
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 8e7d634cf0a22b6f3c1fc6d93afe92c7414fa243
          path: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact dependencies
        run: |
          test "$(git -C replay rev-parse HEAD)" = "696e7bc2432fc7b5cf2d6e6c5f0b944b2d9a265f"
          test "$(git -C runtime rev-parse HEAD)" = "8e7d634cf0a22b6f3c1fc6d93afe92c7414fa243"
      - name: Install native packages
        run: python -m pip install -e replay -e 'evidence[dev]'
      - name: Qualify native recovery evidence mapping
        working-directory: evidence
        env:
          COGNOUS_REPLAY_SOURCE: ${{ github.workspace }}/replay
          COGNOUS_RUNTIME_SOURCE: ${{ github.workspace }}/runtime
        run: python -m pytest -q tests/recovery_inspection_checks.py
