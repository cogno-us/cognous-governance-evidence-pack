# Cross-component suite delegated to its canonical testing repository.
name: Tests
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
permissions:
  contents: read
jobs:
  native:
    name: Component-local checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e '.[dev,replay]'
    - name: Rendered examples are current
      run: |
        for f in examples/*_evidence_pack.json; do
          agep render "$f" --out "examples/rendered/$(basename "$f" .json).md" > /dev/null
        done
        git diff --exit-code -- examples/rendered
    - run: python -m pytest -q tests
      env:
        PYTHONPATH: .:src
        PYTHONDONTWRITEBYTECODE: '1'
  current-generation-e2e:
    # Current-generation end-to-end tests against the real Replay at CUR_REPLAY_PIN. Separate from `native` because that job
    # installs the P2 Replay through the `replay` extra, whose distribution metadata would shadow this checkout; a missing or
    # shadowed Replay fails here (AGEP_REQUIRE_CUR_E2E=1) rather than skipping.
    name: Current-generation end-to-end (Replay at the pin)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Clone Replay at CUR_REPLAY_PIN (read from the importer, so the pin is written once)
      run: |
        pin=$(sed -n 's/^CUR_REPLAY_PIN = "\([0-9a-f]\{40\}\)"$/\1/p' src/agent_governance_evidence_pack/importer.py)
        test -n "$pin"
        git clone --quiet https://github.com/cogno-us/cognous-replay-bundle.git "$RUNNER_TEMP/replay-source"
        git -C "$RUNNER_TEMP/replay-source" checkout --quiet "$pin"
        test "$(git -C "$RUNNER_TEMP/replay-source" rev-parse HEAD)" = "$pin"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -e '.[dev]' 'pydantic>=2.0'
    - run: python -m pytest -q tests/test_current_generation.py
      env:
        PYTHONPATH: .:src
        PYTHONDONTWRITEBYTECODE: '1'
        AGEP_CUR_REPLAY_SOURCE: ${{ runner.temp }}/replay-source
        AGEP_REQUIRE_CUR_E2E: '1'
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-governance-evidence-pack--tests.yml@1c1755ff4ea719cfa12f72bcd8c81dd51cff7fb2
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 1c1755ff4ea719cfa12f72bcd8c81dd51cff7fb2
    permissions:
      contents: read
